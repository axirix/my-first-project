<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FinTrac</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinTrac — personal finance tracker for income and expenses" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1b1b2f, #162447, #1f4068);
        color: #fff;
        padding: 16px;
      }
      .app {
        background: #121520;
        border-radius: 18px;
        max-width: 520px;
        width: 100%;
        padding: 20px 22px 24px;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .app-title {
        font-size: 22px;
        font-weight: 700;
      }
      .app-subtitle {
        font-size: 13px;
        color: #b4b9d6;
        margin-top: 4px;
      }
      .right-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 180px;
      }
      .panel {
        background: #181b2b;
        border-radius: 12px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .panel-label {
        font-size: 11px;
        color: #a3a7c4;
        margin-bottom: 4px;
      }
      .panel-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select,
      input[type="number"] {
        flex: 1;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 5px 8px;
        font-size: 12px;
        color: #fff;
        outline: none;
      }
      .lang-select {
        width: 100%;
      }
      .summary {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .card {
        background: #181b2b;
        border-radius: 12px;
        padding: 12px;
      }
      .card-label {
        font-size: 11px;
        color: #a3a7c4;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .card-value {
        font-size: 18px;
        font-weight: 600;
      }
      .card-value.positive {
        color: #3ad29f;
      }
      .card-value.negative {
        color: #ff6b81;
      }
      .card-badge {
        font-size: 10px;
        color: #8c90b0;
        margin-top: 4px;
      }
      .form {
        margin-top: 18px;
        background: #181b2b;
        border-radius: 14px;
        padding: 14px;
      }
      .form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .field {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .field label {
        font-size: 11px;
        color: #a3a7c4;
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="number"],
      .field select {
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 8px 10px;
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      .type-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 6px 6px 6px 10px;
        margin-top: 6px;
      }
      .type-label {
        font-size: 11px;
        color: #a3a7c4;
      }
      .type-buttons {
        display: flex;
        gap: 4px;
      }
      .type-btn {
        border: none;
        border-radius: 20px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        background: transparent;
        color: #a3a7c4;
      }
      .type-btn.active.income {
        background: rgba(58, 210, 159, 0.15);
        color: #3ad29f;
      }
      .type-btn.active.expense {
        background: rgba(255, 107, 129, 0.15);
        color: #ff6b81;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
      }
      .btn-add {
        border: none;
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: linear-gradient(135deg, #4c9aff, #7c5cff);
        color: #fff;
      }
      .list {
        margin-top: 18px;
      }
      .list-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .list-title {
        font-size: 13px;
        font-weight: 500;
        color: #d7dbff;
      }
      .list-count {
        font-size: 11px;
        color: #8c90b0;
      }
      .items {
        max-height: 220px;
        overflow-y: auto;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .item-left {
        display: flex;
        flex-direction: column;
      }
      .item-title {
        font-size: 13px;
      }
      .item-meta {
        font-size: 11px;
        color: #8c90b0;
      }
      .item-amount {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .item-amount.income {
        color: #3ad29f;
      }
      .item-amount.expense {
        color: #ff6b81;
      }
      .btn-delete {
        border: none;
        background: transparent;
        color: #8c90b0;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 4px;
      }
      .btn-delete:hover {
        color: #ff6b81;
      }
      .empty-state {
        font-size: 12px;
        color: #8c90b0;
        text-align: center;
        padding: 10px 4px;
      }
      @media (max-width: 560px) {
        .top-bar {
          flex-direction: column;
        }
        .right-panel {
          min-width: 0;
        }
        .summary {
          grid-template-columns: 1fr;
        }
        .form-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top-bar">
        <div>
          <div id="titleText" class="app-title">FinTrac</div>
          <div id="subtitleText" class="app-subtitle">
            Simple tracker for your income & expenses.
          </div>
        </div>
        <div class="right-panel">
          <div class="panel">
            <div class="panel-label" id="monthPanelLabel">Report month</div>
            <div class="panel-row">
              <select id="monthSelect">
                <option value="1">Jan</option>
                <option value="2">Feb</option>
                <option value="3">Mar</option>
                <option value="4">Apr</option>
                <option value="5">May</option>
                <option value="6">Jun</option>
                <option value="7">Jul</option>
                <option value="8">Aug</option>
                <option value="9">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
              </select>
              <select id="yearSelect">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
              </select>
            </div>
          </div>
          <div class="panel">
            <div class="panel-label" id="languageLabel">Language</div>
            <div class="panel-row">
              <select id="languageSelect" class="lang-select">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="kz">Қазақ</option>
                <option value="tr">Türkçe</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <section class="summary">
        <div class="card">
          <div class="card-label" id="balanceLabel">Balance</div>
          <div id="balance" class="card-value">0 ₸</div>
          <div class="card-badge" id="balanceBadge">
            Income − Expenses (selected month)
          </div>
        </div>
        <div class="card">
          <div class="card-label" id="incomeLabel">Income</div>
          <div id="income" class="card-value positive">0 ₸</div>
        </div>
        <div class="card">
          <div class="card-label" id="expenseLabel">Expenses</div>
          <div id="expense" class="card-value negative">0 ₸</div>
        </div>
      </section>

      <section class="form">
        <div class="form-row">
          <div class="field">
            <label id="titleFieldLabel">Title</label>
            <input
              id="titleInput"
              type="text"
              placeholder="Salary, Coffee, Taxi..."
            />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label id="amountFieldLabel">Amount</label>
            <input id="amountInput" type="number" min="1" placeholder="0" />
          </div>
          <div class="field">
            <label id="categoryFieldLabel">Category</label>
            <select id="categorySelect">
              <option value="general">General</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="education">Education</option>
              <option value="entertainment">Entertainment</option>
              <option value="health">Health</option>
            </select>
          </div>
          <div class="field">
            <label id="typeFieldLabel">Type</label>
            <div class="type-toggle">
              <span id="typeToggleLabel" class="type-label">
                Income / Expense
              </span>
              <div class="type-buttons">
                <button type="button" class="type-btn active income" id="incomeBtn">
                  Income
                </button>
                <button type="button" class="type-btn expense" id="expenseBtn">
                  Expense
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn-add" id="addBtn">Add</button>
        </div>
      </section>

      <section class="list">
        <div class="list-header">
          <div class="list-title" id="historyTitle">
            History (selected month)
          </div>
          <div class="list-count" id="countLabel">0 items</div>
        </div>
        <div class="items" id="itemsContainer">
          <div class="empty-state" id="emptyStateText">
            No records yet. Add your first income or expense.
          </div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = "fintrac-transactions";
      const SETTINGS_KEY = "fintrac-settings";

      const titleInput = document.getElementById("titleInput");
      const amountInput = document.getElementById("amountInput");
      const categorySelect = document.getElementById("categorySelect");
      const incomeBtn = document.getElementById("incomeBtn");
      const expenseBtn = document.getElementById("expenseBtn");
      const addBtn = document.getElementById("addBtn");
      const itemsContainer = document.getElementById("itemsContainer");
      const balanceEl = document.getElementById("balance");
      const incomeEl = document.getElementById("income");
      const expenseEl = document.getElementById("expense");
      const countLabel = document.getElementById("countLabel");
      const monthSelect = document.getElementById("monthSelect");
      const yearSelect = document.getElementById("yearSelect");
      const languageSelect = document.getElementById("languageSelect");

      const titleText = document.getElementById("titleText");
      const subtitleText = document.getElementById("subtitleText");
      const monthPanelLabel = document.getElementById("monthPanelLabel");
      const languageLabel = document.getElementById("languageLabel");
      const balanceLabel = document.getElementById("balanceLabel");
      const balanceBadge = document.getElementById("balanceBadge");
      const incomeLabelText = document.getElementById("incomeLabel");
      const expenseLabelText = document.getElementById("expenseLabel");
      const titleFieldLabel = document.getElementById("titleFieldLabel");
      const amountFieldLabel = document.getElementById("amountFieldLabel");
      const categoryFieldLabel = document.getElementById("categoryFieldLabel");
      const typeFieldLabel = document.getElementById("typeFieldLabel");
      const typeToggleLabel = document.getElementById("typeToggleLabel");
      const historyTitle = document.getElementById("historyTitle");
      const emptyStateText = document.getElementById("emptyStateText");

      let type = "income";
      let transactions = [];
      let settings = { language: "en" };

      const translations = {
        en: {
          months: {
            1: "January", 2: "February", 3: "March", 4: "April",
            5: "May", 6: "June", 7: "July", 8: "August",
            9: "September", 10: "October", 11: "November", 12: "December",
          },
          title: "FinTrac",
          subtitle: "Simple tracker for your income & expenses.",
          reportMonth: "Report month",
          language: "Language",
          balance: "Balance",
          balanceBadge: "Income − Expenses (selected month)",
          income: "Income",
          expenses: "Expenses",
          titleField: "Title",
          amountField: "Amount",
          categoryField: "Category",
          typeField: "Type",
          typeToggle: "Income / Expense",
          incomeBtn: "Income",
          expenseBtn: "Expense",
          addBtn: "Add",
          historyTitle: "History (selected month)",
          itemsZero: "0 items",
          itemsOne: "1 item",
          itemsMany: "items",
          emptyState: "No records yet. Add your first income or expense.",
          alertMissing: "Please enter title and amount.",
          deleteBtn: "Delete",
          categoryNames: {
            general: "General",
            food: "Food",
            transport: "Transport",
            education: "Education",
            entertainment: "Entertainment",
            health: "Health",
          },
        },
        ru: {
          months: {
            1: "Январь", 2: "Февраль", 3: "Март", 4: "Апрель",
            5: "Май", 6: "Июнь", 7: "Июль", 8: "Август",
            9: "Сентябрь", 10: "Октябрь", 11: "Ноябрь", 12: "Декабрь",
          },
          title: "FinTrac",
          subtitle: "Простой трекер доходов и расходов.",
          reportMonth: "Отчётный месяц",
          language: "Язык",
          balance: "Баланс",
          balanceBadge: "Доходы − расходы (выбранный месяц)",
          income: "Доходы",
          expenses: "Расходы",
          titleField: "Название",
          amountField: "Сумма",
          categoryField: "Категория",
          typeField: "Тип",
          typeToggle: "Доход / Расход",
          incomeBtn: "Доход",
          expenseBtn: "Расход",
          addBtn: "Добавить",
          historyTitle: "История (выбранный месяц)",
          itemsZero: "0 операций",
          itemsOne: "1 операция",
          itemsMany: "операций",
          emptyState: "Пока нет записей. Добавьте первую операцию.",
          alertMissing: "Введите название и сумму.",
          deleteBtn: "Удалить",
          categoryNames: {
            general: "Общее",
            food: "Еда",
            transport: "Транспорт",
            education: "Учёба",
            entertainment: "Развлечения",
            health: "Здоровье",
          },
        },
        kz: {
          months: {
            1: "Қаңтар", 2: "Ақпан", 3: "Наурыз", 4: "Сәуір",
            5: "Мамыр", 6: "Маусым", 7: "Шілде", 8: "Тамыз",
            9: "Қыркүйек", 10: "Қазан", 11: "Қараша", 12: "Желтоқсан",
          },
          title: "FinTrac",
          subtitle: "Кіріс пен шығынды бақылауға арналған қарапайым құрал.",
          reportMonth: "Есептік ай",
          language: "Тіл",
          balance: "Баланс",
          balanceBadge: "Кіріс − шығын (таңдалған ай)",
          income: "Кіріс",
          expenses: "Шығын",
          titleField: "Атауы",
          amountField: "Сома",
          categoryField: "Санат",
          typeField: "Түрі",
          typeToggle: "Кіріс / Шығын",
          incomeBtn: "Кіріс",
          expenseBtn: "Шығын",
          addBtn: "Қосу",
          historyTitle: "Тарих (таңдалған ай)",
          itemsZero: "0 операция",
          itemsOne: "1 операция",
          itemsMany: "операция",
          emptyState: "Әзірге жазбалар жоқ. Бірінші операцияны қосыңыз.",
          alertMissing: "Атауды және соманы енгізіңіз.",
          deleteBtn: "Жою",
          categoryNames: {
            general: "Жалпы",
            food: "Тамақ",
            transport: "Көлік",
            education: "Оқу",
            entertainment: "Ойын-сауық",
            health: "Денсаулық",
          },
        },
        tr: {
          months: {
            1: "Ocak", 2: "Şubat", 3: "Mart", 4: "Nisan",
            5: "Mayıs", 6: "Haziran", 7: "Temmuz", 8: "Ağustos",
            9: "Eylül", 10: "Ekim", 11: "Kasım", 12: "Aralık",
          },
          title: "FinTrac",
          subtitle: "Gelir ve giderleriniz için basit bir takip aracı.",
          reportMonth: "Rapor ayı",
          language: "Dil",
          balance: "Bakiye",
          balanceBadge: "Gelir − Gider (seçili ay)",
          income: "Gelir",
          expenses: "Gider",
          titleField: "Başlık",
          amountField: "Tutar",
          categoryField: "Kategori",
          typeField: "Tür",
          typeToggle: "Gelir / Gider",
          incomeBtn: "Gelir",
          expenseBtn: "Gider",
          addBtn: "Ekle",
          historyTitle: "Geçmiş (seçili ay)",
          itemsZero: "0 kayıt",
          itemsOne: "1 kayıt",
          itemsMany: "kayıt",
          emptyState: "Henüz kayıt yok. İlk gelir veya giderinizi ekleyin.",
          alertMissing: "Lütfen başlık ve tutar girin.",
          deleteBtn: "Sil",
          categoryNames: {
            general: "Genel",
            food: "Yemek",
            transport: "Ulaşım",
            education: "Eğitim",
            entertainment: "Eğlence",
            health: "Sağlık",
          },
        },
      };

      function getTranslation() {
        return translations[settings.language] || translations.en;
      }

      function applyLanguage(lang) {
        settings.language = lang;
        const t = getTranslation();

        titleText.textContent = t.title;
        subtitleText.textContent = t.subtitle;
        monthPanelLabel.textContent = t.reportMonth;
        languageLabel.textContent = t.language;
        balanceLabel.textContent = t.balance;
        balanceBadge.textContent = t.balanceBadge;
        incomeLabelText.textContent = t.income;
        expenseLabelText.textContent = t.expenses;
        titleFieldLabel.textContent = t.titleField;
        amountFieldLabel.textContent = t.amountField;
        categoryFieldLabel.textContent = t.categoryField;
        typeFieldLabel.textContent = t.typeField;
        typeToggleLabel.textContent = t.typeToggle;
        incomeBtn.textContent = t.incomeBtn;
        expenseBtn.textContent = t.expenseBtn;
        addBtn.textContent = t.addBtn;
        historyTitle.textContent = t.historyTitle;
        emptyStateText.textContent = t.emptyState;

        for (const option of categorySelect.options) {
          if (t.categoryNames[option.value]) {
            option.textContent = t.categoryNames[option.value];
          }
        }

        for (const option of monthSelect.options) {
          const monthNumber = Number(option.value);
          if (t.months[monthNumber]) {
            option.textContent = t.months[monthNumber];
          }
        }
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          transactions = raw ? JSON.parse(raw) : [];
        } catch {
          transactions = [];
        }

        try {
          const rawSettings = localStorage.getItem(SETTINGS_KEY);
          settings = rawSettings ? JSON.parse(rawSettings) : { language: "en" };
        } catch {
          settings = { language: "en" };
        }

        languageSelect.value = settings.language || "en";
        applyLanguage(languageSelect.value);
      }

      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }

      function deleteTransaction(id) {
        transactions = transactions.filter((item) => item.id !== id);
        saveToStorage();
        render();
      }

      incomeBtn.addEventListener("click", () => {
        type = "income";
        incomeBtn.classList.add("active", "income");
        expenseBtn.classList.remove("active", "expense");
      });

      expenseBtn.addEventListener("click", () => {
        type = "expense";
        expenseBtn.classList.add("active", "expense");
        incomeBtn.classList.remove("active", "income");
      });

      languageSelect.addEventListener("change", () => {
        applyLanguage(languageSelect.value);
        saveSettings();
        render();
      });

      addBtn.addEventListener("click", () => {
        const t = getTranslation();
        const title = titleInput.value.trim();
        const amount = Number(amountInput.value);
        const category = categorySelect.value;

        if (!title || !amount || amount <= 0) {
          alert(t.alertMissing);
          return;
        }

        const now = new Date();
        transactions.unshift({
          id: Date.now(),
          title,
          amount,
          type,
          category,
          dateString: now.toLocaleDateString(),
          year: now.getFullYear(),
          month: now.getMonth() + 1,
        });

        saveToStorage();
        titleInput.value = "";
        amountInput.value = "";
        render();
      });

      monthSelect.addEventListener("change", render);
      yearSelect.addEventListener("change", render);

      function render() {
        const selectedMonth = Number(monthSelect.value);
        const selectedYear = Number(yearSelect.value);
        const filtered = transactions.filter(
          (item) => item.year === selectedYear && item.month === selectedMonth
        );

        const t = getTranslation();

        if (filtered.length === 0) {
          itemsContainer.innerHTML =
            '<div class="empty-state">' + t.emptyState + "</div>";
        } else {
          itemsContainer.innerHTML = filtered
            .map((item) => {
              const catName =
                t.categoryNames[item.category] || t.categoryNames.general;
              const sign = item.type === "income" ? "+" : "−";
              const amountClass = item.type === "income" ? "income" : "expense";

              return `
                <div class="item">
                  <div class="item-left">
                    <div class="item-title">${item.title}</div>
                    <div class="item-meta">${item.dateString} · ${catName}</div>
                  </div>
                  <div class="item-amount ${amountClass}">${sign} ${item.amount} ₸</div>
                  <button type="button" class="btn-delete" data-id="${item.id}" title="${t.deleteBtn}">×</button>
                </div>
              `;
            })
            .join("");

          itemsContainer.querySelectorAll(".btn-delete").forEach((button) => {
            button.addEventListener("click", () => {
              deleteTransaction(Number(button.dataset.id));
            });
          });
        }

        const incomeTotal = filtered
          .filter((item) => item.type === "income")
          .reduce((sum, item) => sum + item.amount, 0);
        const expenseTotal = filtered
          .filter((item) => item.type === "expense")
          .reduce((sum, item) => sum + item.amount, 0);

        incomeEl.textContent = `${incomeTotal} ₸`;
        expenseEl.textContent = `${expenseTotal} ₸`;
        balanceEl.textContent = `${incomeTotal - expenseTotal} ₸`;

        if (filtered.length === 0) {
          countLabel.textContent = t.itemsZero;
        } else if (filtered.length === 1) {
          countLabel.textContent = t.itemsOne;
        } else {
          countLabel.textContent = `${filtered.length} ${t.itemsMany}`;
        }
      }

      loadFromStorage();
      const now = new Date();
      monthSelect.value = String(now.getMonth() + 1);
      yearSelect.value = String(now.getFullYear());
      render();
    </script>
  </body>
</html>
