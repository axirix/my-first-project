<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finance Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1b1b2f, #162447, #1f4068);
        color: #fff;
      }
      .app {
        background: #121520;
        border-radius: 18px;
        max-width: 520px;
        width: 100%;
        padding: 20px 22px 24px;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .app-title {
        font-size: 22px;
        font-weight: 700;
      }
      .app-subtitle {
        font-size: 13px;
        color: #b4b9d6;
        margin-top: 4px;
      }
      .right-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 180px;
      }
      .panel {
        background: #181b2b;
        border-radius: 12px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .panel-label {
        font-size: 11px;
        color: #a3a7c4;
        margin-bottom: 4px;
      }
      .panel-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select,
      input[type="number"] {
        flex: 1;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 5px 8px;
        font-size: 12px;
        color: #fff;
        outline: none;
      }
      .lang-select {
        width: 100%;
      }

      .summary {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .card {
        background: #181b2b;
        border-radius: 12px;
        padding: 12px;
      }
      .card-label {
        font-size: 11px;
        color: #a3a7c4;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .card-value {
        font-size: 18px;
        font-weight: 600;
      }
      .card-value.positive {
        color: #3ad29f;
      }
      .card-value.negative {
        color: #ff6b81;
      }
      .card-badge {
        font-size: 10px;
        color: #8c90b0;
        margin-top: 4px;
      }

      .form {
        margin-top: 18px;
        background: #181b2b;
        border-radius: 14px;
        padding: 14px;
      }
      .form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .field {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .field label {
        font-size: 11px;
        color: #a3a7c4;
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="number"] {
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 8px 10px;
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      .type-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 6px 6px 6px 10px;
        margin-top: 6px;
      }
      .type-label {
        font-size: 11px;
        color: #a3a7c4;
      }
      .type-buttons {
        display: flex;
        gap: 4px;
      }
      .type-btn {
        border: none;
        border-radius: 20px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        background: transparent;
        color: #a3a7c4;
      }
      .type-btn.active.income {
        background: rgba(58, 210, 159, 0.15);
        color: #3ad29f;
      }
      .type-btn.active.expense {
        background: rgba(255, 107, 129, 0.15);
        color: #ff6b81;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
      }
      .btn-add {
        border: none;
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: linear-gradient(135deg, #4c9aff, #7c5cff);
        color: #fff;
      }

      .list {
        margin-top: 18px;
      }
      .list-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .list-title {
        font-size: 13px;
        font-weight: 500;
        color: #d7dbff;
      }
      .list-count {
        font-size: 11px;
        color: #8c90b0;
      }
      .items {
        max-height: 220px;
        overflow-y: auto;
      }
      .item {
        display: flex;
        justify-content: space-between;
        padding: 8px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .item-left {
        display: flex;
        flex-direction: column;
      }
      .item-title {
        font-size: 13px;
      }
      .item-meta {
        font-size: 11px;
        color: #8c90b0;
      }
      .item-amount {
        font-size: 13px;
        font-weight: 500;
      }
      .item-amount.income {
        color: #3ad29f;
      }
      .item-amount.expense {
        color: #ff6b81;
      }
      .empty-state {
        font-size: 12px;
        color: #8c90b0;
        text-align: center;
        padding: 10px 4px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top-bar">
        <div>
          <div id="titleText" class="app-title">Finance Tracker</div>
          <div id="subtitleText" class="app-subtitle">
            Simple tracker for your income & expenses.
          </div>
        </div>
        <div class="right-panel">
          <div class="panel">
            <div class="panel-label" id="monthPanelLabel">Report month</div>
            <div class="panel-row">
              <select id="monthSelect">
                <option value="1">Jan</option>
                <option value="2">Feb</option>
                <option value="3">Mar</option>
                <option value="4">Apr</option>
                <option value="5">May</option>
                <option value="6">Jun</option>
                <option value="7">Jul</option>
                <option value="8">Aug</option>
                <option value="9">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
              </select>
              <select id="yearSelect">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
              </select>
            </div>
          </div>
          <div class="panel">
            <div class="panel-label" id="languageLabel">Language</div>
            <div class="panel-row">
              <select id="languageSelect" class="lang-select">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="kz">Қазақ</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <section class="summary">
        <div class="card">
          <div class="card-label" id="balanceLabel">Balance</div>
          <div id="balance" class="card-value">0 ₸</div>
          <div class="card-badge" id="balanceBadge">
            Income − Expenses (selected month)
          </div>
        </div>
        <div class="card">
          <div class="card-label" id="incomeLabel">Income</div>
          <div id="income" class="card-value positive">0 ₸</div>
        </div>
        <div class="card">
          <div class="card-label" id="expenseLabel">Expenses</div>
          <div id="expense" class="card-value negative">0 ₸</div>
        </div>
      </section>

      <section class="form">
        <div class="form-row">
          <div class="field">
            <label id="titleFieldLabel">Title</label>
            <input
              id="titleInput"
              type="text"
              placeholder="Salary, Coffee, Taxi..."
            />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label id="amountFieldLabel">Amount</label>
            <input id="amountInput" type="number" placeholder="0" />
          </div>
          <div class="field">
            <label id="typeFieldLabel">Type</label>
            <div class="type-toggle">
              <span id="typeToggleLabel" class="type-label">
                Income / Expense
              </span>
              <div class="type-buttons">
                <button
                  type="button"
                  class="type-btn active income"
                  id="incomeBtn"
                >
                  Income
                </button>
                <button
                  type="button"
                  class="type-btn expense"
                  id="expenseBtn"
                >
                  Expense
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn-add" id="addBtn">Add</button>
        </div>
      </section>

      <section class="list">
        <div class="list-header">
          <div class="list-title" id="historyTitle">
            History (selected month)
          </div>
          <div class="list-count" id="countLabel">0 items</div>
        </div>
        <div class="items" id="itemsContainer">
          <div class="empty-state" id="emptyStateText">
            No records yet. Add your first income or expense.
          </div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = "finance-tracker-transactions";
      const SETTINGS_KEY = "finance-tracker-settings";

      const titleInput = document.getElementById("titleInput");
      const amountInput = document.getElementById("amountInput");
      const incomeBtn = document.getElementById("incomeBtn");
      const expenseBtn = document.getElementById("expenseBtn");
      const addBtn = document.getElementById("addBtn");
      const itemsContainer = document.getElementById("itemsContainer");
      const balanceEl = document.getElementById("balance");
      const incomeEl = document.getElementById("income");
      const expenseEl = document.getElementById("expense");
      const countLabel = document.getElementById("countLabel");
      const monthSelect = document.getElementById("monthSelect");
      const yearSelect = document.getElementById("yearSelect");
      const languageSelect = document.getElementById("languageSelect");

      // UI text elements
      const titleText = document.getElementById("titleText");
      const subtitleText = document.getElementById("subtitleText");
      const monthPanelLabel = document.getElementById("monthPanelLabel");
      const languageLabel = document.getElementById("languageLabel");
      const balanceLabel = document.getElementById("balanceLabel");
      const balanceBadge = document.getElementById("balanceBadge");
      const incomeLabelText = document.getElementById("incomeLabel");
      const expenseLabelText = document.getElementById("expenseLabel");
      const titleFieldLabel = document.getElementById("titleFieldLabel");
      const amountFieldLabel = document.getElementById("amountFieldLabel");
      const typeFieldLabel = document.getElementById("typeFieldLabel");
      const typeToggleLabel = document.getElementById("typeToggleLabel");
      const historyTitle = document.getElementById("historyTitle");
      const emptyStateText = document.getElementById("emptyStateText");

      let type = "income";
      let transactions = [];
      let settings = {
        language: "en",
      };

      const translations = {
        en: {
          title: "Finance Tracker",
          subtitle: "Simple tracker for your income & expenses.",
          reportMonth: "Report month",
          language: "Language",
          balance: "Balance",
          balanceBadge: "Income − Expenses (selected month)",
          income: "Income",
          expenses: "Expenses",
          titleField: "Title",
          amountField: "Amount",
          typeField: "Type",
          typeToggle: "Income / Expense",
          incomeBtn: "Income",
          expenseBtn: "Expense",
          addBtn: "Add",
          historyTitle: "History (selected month)",
          itemsZero: "0 items",
          itemsOne: "1 item",
          itemsMany: "items",
          emptyState: "No records yet. Add your first income or expense.",
          alertMissing: "Please enter title and amount.",
        },
        ru: {
          title: "Финансовый трекер",
          subtitle: "Простой трекер доходов и расходов.",
          reportMonth: "Отчётный месяц",
          language: "Язык",
          balance: "Баланс",
          balanceBadge: "Доходы − расходы (выбранный месяц)",
          income: "Доходы",
          expenses: "Расходы",
          titleField: "Название",
          amountField: "Сумма",
          typeField: "Тип",
          typeToggle: "Доход / Расход",
          incomeBtn: "Доход",
          expenseBtn: "Расход",
          addBtn: "Добавить",
          historyTitle: "История (выбранный месяц)",
          itemsZero: "0 операций",
          itemsOne: "1 операция",
          itemsMany: "операций",
          emptyState: "Пока нет записей. Добавьте первую операцию.",
          alertMissing: "Введите название и сумму.",
        },
        kz: {
          title: "Қаржы трэкері",
          subtitle: "Кіріс пен шығынды бақылауға арналған қарапайым құрал.",
          reportMonth: "Есептік ай",
          language: "Тіл",
          balance: "Баланс",
          balanceBadge: "Кіріс − шығын (таңдалған ай)",
          income: "Кіріс",
          expenses: "Шығын",
          titleField: "Атауы",
          amountField: "Сома",
          typeField: "Түрі",
          typeToggle: "Кіріс / Шығын",
          incomeBtn: "Кіріс",
          expenseBtn: "Шығын",
          addBtn: "Қосу",
          historyTitle: "Тарих (таңдалған ай)",
          itemsZero: "0 операция",
          itemsOne: "1 операция",
          itemsMany: "операция",
          emptyState: "Әзірге жазбалар жоқ. Бірінші операцияны қосыңыз.",
          alertMissing: "Атауды және соманы енгізіңіз.",
        },
      };

      function applyLanguage(lang) {
        const t = translations[lang] || translations.en;
        titleText.textContent = t.title;
        subtitleText.textContent = t.subtitle;
        monthPanelLabel.textContent = t.reportMonth;
        languageLabel.textContent = t.language;
        balanceLabel.textContent = t.balance;
        balanceBadge.textContent = t.balanceBadge;
        incomeLabelText.textContent = t.income;
        expenseLabelText.textContent = t.expenses;
        titleFieldLabel.textContent = t.titleField;
        amountFieldLabel.textContent = t.amountField;
        typeFieldLabel.textContent = t.typeField;
        typeToggleLabel.textContent = t.typeToggle;
        incomeBtn.textContent = t.incomeBtn;
        expenseBtn.textContent = t.expenseBtn;
        addBtn.textContent = t.addBtn;
        historyTitle.textContent = t.historyTitle;
        emptyStateText.textContent = t.emptyState;
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) transactions = JSON.parse(raw);
        } catch (e) {
          transactions = [];
        }
        try {
          const rawSettings = localStorage.getItem(SETTINGS_KEY);
          if (rawSettings) settings = JSON.parse(rawSettings);
        } catch (e) {
          settings = { language: "en" };
        }
        languageSelect.value = settings.language || "en";
        applyLanguage(languageSelect.value);
      }

      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }

      incomeBtn.addEventListener("click", () => {
        type = "income";
        incomeBtn.classList.add("active", "income");
        expenseBtn.classList.remove("active", "expense");
      });

      expenseBtn.addEventListener("click", () => {
        type = "expense";
        expenseBtn.classList.add("active", "expense");
        incomeBtn.classList.remove("active", "income");
      });

      languageSelect.addEventListener("change", () => {
        const lang = languageSelect.value;
        settings.language = lang;
        saveSettings();
        applyLanguage(lang);
        render(); // чтобы пересчитать текст для countLabel
      });

      addBtn.addEventListener("click", () => {
        const t = translations[settings.language] || translations.en;
        const title = titleInput.value.trim();
        const amount = Number(amountInput.value);
        if (!title || !amount) {
          alert(t.alertMissing);
          return;
        }

        const now = new Date();
        const transaction = {
          id: Date.now(),
          title,
          amount,
          type,
          dateString: now.toLocaleDateString(),
          year: now.getFullYear(),
          month: now.getMonth() + 1,
        };

        transactions.unshift(transaction);
        saveToStorage();

        titleInput.value = "";
        amountInput.value = "";
        render();
      });

      monthSelect.addEventListener("change", render);
      yearSelect.addEventListener("change", render);

      function render() {
        const selectedMonth = Number(monthSelect.value);
        const selectedYear = Number(yearSelect.value);
        const filtered = transactions.filter(
          (t) => t.year === selectedYear && t.month === selectedMonth
        );

        const lang = settings.language || "en";
        const tr = translations[lang] || translations.en;

        if (filtered.length === 0) {
          itemsContainer.innerHTML =
            '<div class="empty-state">' + tr.emptyState + "</div>";
        } else {
          itemsContainer.innerHTML = "";
          filtered.forEach((t) => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <div class="item-left">
                <div class="item-title">${t.title}</div>
                <div class="item-meta">${t.dateString}</div>
              </div>
              <div class="item-amount ${
                t.type === "income" ? "income" : "expense"
              }">
                ${t.type === "income" ? "+" : "-"} ${t.amount} ₸
              </div>
            `;
            itemsContainer.appendChild(div);
          });
        }

        const incomeTotal = filtered
          .filter((t) => t.type === "income")
          .reduce((sum, t) => sum + t.amount, 0);
        const expenseTotal = filtered
          .filter((t) => t.type === "expense")
          .reduce((sum, t) => sum + t.amount, 0);
        const balance = incomeTotal - expenseTotal;

        incomeEl.textContent = `${incomeTotal} ₸`;
        expenseEl.textContent = `${expenseTotal} ₸`;
        balanceEl.textContent = `${balance} ₸`;

        if (filtered.length === 0) {
          countLabel.textContent = tr.itemsZero;
        } else if (filtered.length === 1) {
          countLabel.textContent = tr.itemsOne;
        } else {
          countLabel.textContent = `${filtered.length} ${tr.itemsMany}`;
        }
      }

      // init
      loadFromStorage();
      const now = new Date();
      monthSelect.value = String(now.getMonth() + 1);
      yearSelect.value = String(now.getFullYear());
      render();
    </script>
  </body>
</html>
