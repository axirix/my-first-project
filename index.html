<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finance Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1b1b2f, #162447, #1f4068);
        color: #fff;
      }

      .app {
        background: #121520;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 520px;
        width: 100%;
        padding: 20px 22px 24px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }

      .app-title-block {
        margin-bottom: 12px;
      }

      .app-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .app-subtitle {
        font-size: 13px;
        color: #b4b9d6;
        margin-top: 4px;
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 180px;
      }

      .period,
      .settings {
        background: #181b2b;
        border-radius: 12px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .panel-label {
        font-size: 11px;
        color: #a3a7c4;
        margin-bottom: 4px;
      }

      .period-row {
        display: flex;
        gap: 6px;
      }

      .period select {
        flex: 1;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 5px 8px;
        font-size: 12px;
        color: #fff;
        outline: none;
      }

      .period select:focus {
        border-color: #4c9aff;
        box-shadow: 0 0 0 1px rgba(76, 154, 255, 0.4);
      }

      .settings-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .settings-row span {
        font-size: 11px;
        color: #a3a7c4;
      }

      .settings-row input {
        width: 60px;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 4px 6px;
        font-size: 12px;
        color: #fff;
        outline: none;
        text-align: center;
      }

      .settings-row input:focus {
        border-color: #4c9aff;
        box-shadow: 0 0 0 1px rgba(76, 154, 255, 0.4);
      }

      .summary {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .card {
        background: #181b2b;
        border-radius: 12px;
        padding: 12px 12px 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .card-label {
        font-size: 11px;
        color: #a3a7c4;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }

      .card-value {
        font-size: 18px;
        font-weight: 600;
      }

      .card-value.positive {
        color: #3ad29f;
      }

      .card-value.negative {
        color: #ff6b81;
      }

      .card-badge {
        font-size: 10px;
        color: #8c90b0;
        margin-top: 4px;
      }

      .form {
        margin-top: 18px;
        background: #181b2b;
        border-radius: 14px;
        padding: 14px 14px 12px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }

      .field {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .field label {
        font-size: 11px;
        color: #a3a7c4;
        margin-bottom: 4px;
      }

      .field input {
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 8px 10px;
        color: #fff;
        font-size: 13px;
        outline: none;
      }

      .field input:focus {
        border-color: #4c9aff;
        box-shadow: 0 0 0 1px rgba(76, 154, 255, 0.4);
      }

      .type-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 6px 6px 6px 10px;
      }

      .type-label {
        font-size: 11px;
        color: #a3a7c4;
      }

      .type-buttons {
        display: flex;
        gap: 4px;
      }

      .type-btn {
        border: none;
        border-radius: 20px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        background: transparent;
        color: #a3a7c4;
      }

      .type-btn.active.income {
        background: rgba(58, 210, 159, 0.15);
        color: #3ad29f;
      }

      .type-btn.active.expense {
        background: rgba(255, 107, 129, 0.15);
        color: #ff6b81;
      }

      .expense-kind-toggle {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #121520;
        border-radius: 8px;
        border: 1px solid #262a3f;
        padding: 6px 6px 6px 10px;
      }

      .expense-kind-label {
        font-size: 11px;
        color: #a3a7c4;
      }

      .expense-kind-buttons {
        display: flex;
        gap: 4px;
      }

      .expense-kind-btn {
        border: none;
        border-radius: 20px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        background: transparent;
        color: #a3a7c4;
      }

      .expense-kind-btn.emotional.active {
        background: rgba(255, 107, 129, 0.15);
        color: #ff6b81;
      }

      .expense-kind-btn.essential.active {
        background: rgba(58, 210, 159, 0.15);
        color: #3ad29f;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
      }

      .btn-add {
        border: none;
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: linear-gradient(135deg, #4c9aff, #7c5cff);
        color: #fff;
        box-shadow: 0 8px 18px rgba(76, 154, 255, 0.4);
      }

      .btn-add:hover {
        filter: brightness(1.08);
      }

      .btn-add:active {
        transform: translateY(1px);
        box-shadow: 0 6px 14px rgba(76, 154, 255, 0.45);
      }

      .list {
        margin-top: 18px;
      }

      .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .list-title {
        font-size: 13px;
        font-weight: 500;
        color: #d7dbff;
      }

      .list-count {
        font-size: 11px;
        color: #8c90b0;
      }

      .items {
        max-height: 220px;
        overflow-y: auto;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .item-left {
        display: flex;
        flex-direction: column;
      }

      .item-title {
        font-size: 13px;
      }

      .item-meta {
        font-size: 11px;
        color: #8c90b0;
      }

      .item-amount {
        font-size: 13px;
        font-weight: 500;
      }

      .item-amount.income {
        color: #3ad29f;
      }

      .item-amount.expense {
        color: #ff6b81;
      }

      .item-tag {
        font-size: 10px;
        border-radius: 999px;
        padding: 2px 8px;
        margin-left: 6px;
      }

      .item-tag.emotional {
        background: rgba(255, 107, 129, 0.15);
        color: #ff9aa5;
      }

      .item-tag.essential {
        background: rgba(58, 210, 159, 0.15);
        color: #7be3bd;
      }

      .empty-state {
        font-size: 12px;
        color: #8c90b0;
        text-align: center;
        padding: 10px 4px;
      }

      @media (max-width: 520px) {
        .top-bar {
          flex-direction: column;
        }

        .right-panel {
          flex-direction: row;
        }

        .app {
          max-width: 100%;
        }
      }

      @media (max-width: 480px) {
        .app {
          border-radius: 0;
          max-width: 100%;
          height: 100vh;
        }

        body {
          align-items: flex-start;
          justify-content: center;
        }

        .right-panel {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <div class="top-bar">
        <div class="app-title-block">
          <div class="app-title">Finance Tracker</div>
          <div class="app-subtitle">
            Simple tracker for your income & expenses.
          </div>
        </div>

        <div class="right-panel">
          <div class="period">
            <div class="panel-label">Report month</div>
            <div class="period-row">
              <select id="monthSelect">
                <option value="1">Jan</option>
                <option value="2">Feb</option>
                <option value="3">Mar</option>
                <option value="4">Apr</option>
                <option value="5">May</option>
                <option value="6">Jun</option>
                <option value="7">Jul</option>
                <option value="8">Aug</option>
                <option value="9">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
              </select>
              <select id="yearSelect">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
              </select>
            </div>
          </div>

          <div class="settings">
            <div class="panel-label">Settings</div>
            <div class="settings-row">
              <span>Max emotional:</span>
              <input
                id="maxEmotionalInput"
                type="number"
                min="0"
                placeholder="10"
              />
            </div>
          </div>
        </div>
      </div>

      <section class="summary">
        <div class="card">
          <div class="card-label">Balance</div>
          <div id="balance" class="card-value">0 ₸</div>
          <div class="card-badge">Income − Expenses (selected month)</div>
        </div>
        <div class="card">
          <div class="card-label">Income</div>
          <div id="income" class="card-value positive">0 ₸</div>
        </div>
        <div class="card">
          <div class="card-label">Expenses</div>
          <div id="expense" class="card-value negative">0 ₸</div>
        </div>
      </section>

      <section class="form">
        <div class="form-row">
          <div class="field">
            <label>Title</label>
            <input
              id="titleInput"
              type="text"
              placeholder="Salary, Coffee, Taxi..."
            />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Amount</label>
            <input id="amountInput" type="number" placeholder="0" />
          </div>
          <div class="field">
            <label>Type</label>
            <div class="type-toggle">
              <span class="type-label">Income / Expense</span>
              <div class="type-buttons">
                <button
                  type="button"
                  class="type-btn active income"
                  id="incomeBtn"
                >
                  Income
                </button>
                <button
                  type="button"
                  class="type-btn expense"
                  id="expenseBtn"
                >
                  Expense
                </button>
              </div>
            </div>

            <div class="expense-kind-toggle" id="expenseKindBlock">
              <span class="expense-kind-label">Expense type</span>
              <div class="expense-kind-buttons">
                <button
                  type="button"
                  class="expense-kind-btn emotional active"
                  id="emotionalBtn"
                >
                  Emotional
                </button>
                <button
                  type="button"
                  class="expense-kind-btn essential"
                  id="essentialBtn"
                >
                  Essential
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn-add" id="addBtn">Add</button>
        </div>
      </section>

      <section class="list">
        <div class="list-header">
          <div class="list-title">History (selected month)</div>
          <div class="list-count" id="countLabel">0 items</div>
        </div>
        <div class="items" id="itemsContainer">
          <div class="empty-state">
            No records yet. Add your first income or expense.
          </div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = "finance-tracker-transactions";
      const SETTINGS_KEY = "finance-tracker-settings";

      const titleInput = document.getElementById("titleInput");
      const amountInput = document.getElementById("amountInput");
      const incomeBtn = document.getElementById("incomeBtn");
      const expenseBtn = document.getElementById("expenseBtn");
      const addBtn = document.getElementById("addBtn");
      const itemsContainer = document.getElementById("itemsContainer");
      const balanceEl = document.getElementById("balance");
      const incomeEl = document.getElementById("income");
      const expenseEl = document.getElementById("expense");
      const countLabel = document.getElementById("countLabel");
      const monthSelect = document.getElementById("monthSelect");
      const yearSelect = document.getElementById("yearSelect");
      const expenseKindBlock = document.getElementById("expenseKindBlock");
      const emotionalBtn = document.getElementById("emotionalBtn");
      const essentialBtn = document.getElementById("essentialBtn");
      const maxEmotionalInput = document.getElementById("maxEmotionalInput");

      let type = "income";
      let expenseKind = "emotional"; // or "essential"
      let transactions = [];
      let settings = {
        maxEmotional: 10,
      };

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY
